<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Ratakirjaus 2.0</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:#eef2f7;
    padding:8px;
}

.card{
    max-width:480px;
    margin:auto;
    background:#fff;
    border:1px solid #000;
    padding:16px;
}

.header{
    text-align:center;
    margin-bottom:20px;
}

.header h1{
    font-size:28px;
    color:#1a365d;
    margin-bottom:4px;
}

.header p{
    color:#666;
    font-size:15px;
}

label{
    display:block;
    margin-top:16px;
    margin-bottom:6px;
    font-weight:600;
}

input,
select{
    width:100%;
    min-height:52px;
    padding:14px 16px;
    border:2px solid #000;
    font-size:18px;
    background:#fff;
}

input:focus,
select:focus{
    outline:none;
    border-color:#1e88e5;
}

button{
    width:100%;
    min-height:60px;
    margin-top:24px;
    border:none;
    background:#1e88e5;
    color:white;
    font-size:20px;
    font-weight:700;
    cursor:pointer;
}

button:disabled{
    background:#999;
}

#status{
    text-align:center;
    margin-top:15px;
    font-size:18px;
    font-weight:700;
    min-height:30px;
}

.required{
    color:#d32f2f;
}
</style>
</head>

<body>

<div class="card">

    <div class="header">
        <h1>Ratakirjaus</h1>
        <p>Kirjaa ratakäyntisi</p>
    </div>

    <label>
        PIN <span class="required">*</span>
    </label>
    <input
        type="text"
        id="pin"
        autocomplete="off"
        placeholder="PIN-koodi"
        required>

    <label>
        Ampujan nimi <span class="required">*</span>
    </label>
    <input
        type="text"
        id="nimi"
        autocomplete="name"
        placeholder="Sukunimi Etunimi"
        required>

    <label>
        Sähköposti <span class="required">*</span>
    </label>
    <input
        type="email"
        id="sahkoposti"
        autocomplete="email"
        placeholder="nimi@example.fi"
        required>

    <label>
        Ampumispäivä
    </label>
    <input
        type="date"
        id="paivamaara">

    <label>
        Rata <span class="required">*</span>
    </label>
    <select id="rata" required>
        <option value="">Valitse rata</option>
        <option value="25m">25 m</option>
        <option value="50m">50 m</option>
        <option value="100m">100 m</option>
    </select>

    <label>
        Maksutapa <span class="required">*</span>
    </label>
    <select id="maksettu" required>
        <option value="">Valitse maksutapa</option>
        <option value="Kausimaksu">Kausimaksu</option>
        <option value="Pankkisiirto">Pankkisiirto</option>
        <option value="Käteinen">Käteinen</option>
    </select>

    <label>
        Laukausmäärä <span class="required">*</span>
    </label>
    <input
        type="text"
        id="laukaukset"
        inputmode="numeric"
        maxlength="4"
        enterkeyhint="done"
        autocomplete="off"
        placeholder="0-4999"
        required>

    <button id="lahetaBtn" onclick="laheta()">
        Lähetä ratakirjaus
    </button>

    <div id="status"></div>

</div>

<script>

const WEBAPP_URL =
"https://script.google.com/macros/s/AKfycbyLGFluyr9gRwEn4IimxoYRBpZ2nLC7J__HW_s7U47aQAyLhgie0KX3iBzEexjYkJpY/exec";

// Oletuspäivä
document.getElementById("paivamaara").value =
new Date().toISOString().split("T")[0];

// Muista tiedot
//document.getElementById("pin").value =
//localStorage.getItem("pin") || "";
    
document.getElementById("nimi").value =
localStorage.getItem("nimi") || "";

document.getElementById("sahkoposti").value =
localStorage.getItem("sahkoposti") || "";

// Sallitaan vain numerot ja max 4999
document.getElementById("laukaukset").addEventListener("input", function() {

    this.value = this.value.replace(/\D/g, "");

    if (this.value !== "" && Number(this.value) > 4999) {
        this.value = "4999";
    }
});

async function laheta() {

    const button = document.getElementById("lahetaBtn");

    const data = {
        pin: document.getElementById("pin").value.trim(),
        nimi: document.getElementById("nimi").value.trim(),
        sahkoposti: document.getElementById("sahkoposti").value.trim(),
        paivamaara: document.getElementById("paivamaara").value,
        rata: document.getElementById("rata").value,
        maksettu: document.getElementById("maksettu").value,
        laukaukset: document.getElementById("laukaukset").value
    };

    if (
        !data.pin ||
        !data.nimi ||
        !data.sahkoposti ||
        !data.rata ||
        !data.maksettu ||
        !data.laukaukset
    ) {
        document.getElementById("status").innerHTML =
            "⚠️ Täytä kaikki pakolliset kentät";
        return;
    }

    if (
        !/^\d+$/.test(data.laukaukset) ||
        Number(data.laukaukset) > 4999
    ) {
        document.getElementById("status").innerHTML =
            "⚠️ Laukausmäärän tulee olla kokonaisluku välillä 0–4999";
        document.getElementById("laukaukset").focus();
        return;
    }

    //localStorage.setItem("pin", data.pin);
    localStorage.setItem("nimi", data.nimi);
    localStorage.setItem("sahkoposti", data.sahkoposti);

    button.disabled = true;
    button.textContent = "Tallennetaan...";

    document.getElementById("status").innerHTML =
        "⏳ Tallennetaan...";

    try {

        const response = await fetch(
            WEBAPP_URL,
            {
                method: "POST",
                headers: {
                    "Content-Type": "text/plain;charset=utf-8"
                },
                body: JSON.stringify(data)
            }
        );

        const result = await response.text();

        if (result === "OK") {

            document.getElementById("status").innerHTML =
                "✅ Tiedot tallennettu ja sait kirjauksesta vahvistussähköpostin.";


            document.getElementById("rata").value = "";
            document.getElementById("maksettu").value = "";
            document.getElementById("laukaukset").value = "";
            //document.getElementById("pin").value = "";

        }
        else if (result === "VIRHEELLINEN PIN") {

            document.getElementById("status").innerHTML =
                "❌ Virheellinen PIN-koodi";
        }
        else {

            document.getElementById("status").innerHTML =
                "❌ Virhe: " + result;
        }

    }
    catch (error) {

        document.getElementById("status").innerHTML =
            "❌ Yhteysvirhe palvelimeen";
    }
    finally {

        button.disabled = false;
        button.textContent = "Lähetä ratakirjaus";
    }
}

</script>

</body>
</html>
