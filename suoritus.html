<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Sähköpostivahvistus</title>
</head>
<body>

<h2>Vahvista sähköpostiosoitteesi</h2>

<input
    type="email"
    id="email"
    placeholder="Sähköpostiosoite"
    required>

<button onclick="sendVerification()">
    Lähetä vahvistuslinkki
</button>

<p id="status"></p>

<script>

const WEBAPP_URL =
"https://script.google.com/macros/s/AKfycbw74dpua_GNYzuZAmkoNFmeRUD5NHHpFGWYk7xZdb39N4j4qxymQoo7wmsuElbihLjH-Q/exec";


async function sendVerification() {

    const email =
        document.getElementById("email").value;

    document.getElementById("status").textContent =
        "Lähetetään...";

    try {

        const response = await fetch(
            WEBAPP_URL,
            {
                method: "POST",
                headers: {
                    "Content-Type": "text/plain;charset=utf-8"
                },
                body: JSON.stringify({
                    action: "sendVerification",
                    email: email
                })
            }
        );

        const result = await response.text();

        document.getElementById("status").textContent =
            result;

    } catch (error) {

        document.getElementById("status").textContent =
            "Virhe: " + error.message;
    }
}

</script>

</body>
</html>
