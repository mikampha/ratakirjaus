<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Ratakirjaus</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:#eef2f7;
    padding:15px;
}

.card{
    max-width:600px;
    margin:auto;
    background:white;
    border:1px solid #000;
    border-radius:0;
    padding:24px;
    box-shadow:none;
}

.header{
    text-align:center;
    margin-bottom:25px;
}

.header h1{
    font-size:28px;
    color:#1a365d;
    margin-bottom:5px;
}

.header p{
    color:#666;
    font-size:16px;
}

label{
    display:block;
    margin-top:18px;
    margin-bottom:6px;
    font-weight:600;
    color:#333;
}

    
input,
select{
    width:100%;
    padding:14px;
    border:1px solid #000;
    border-radius:0px;
    font-size:16px;
    background:#fff;
}

input:focus,
select:focus{
    outline:none;
    border-color:#1e88e5;
    background:white;
}

button{
    width:100%;
    margin-top:28px;
    padding:16px;
    border:none;
    border-radius:0px;
    background:#1e88e5;
    color:white;
    font-size:18px;
    font-weight:600;
    cursor:pointer;
}

button:hover{
    background:#1669bb;
}

#status{
    text-align:center;
    margin-top:15px;
    font-weight:600;
}

.required{
    color:#e53935;
}
</style>

</head>
<body>

<div class="card">

    <div class="header">
        <h1>Ratakirjaus</h1>
        <p>Kirjaa päivän ratakäyntisi ja laukausmäärä</p>
    </div>


    <label>
        PIN <span class="required">*</span>
    </label>
    <input
        type="text"
        id="pin"
        placeholder="pin-koodi"
        required>
  
    <label>
        Ampujan nimi <span class="required">*</span>
    </label>
    <input
        type="text"
        id="nimi"
        placeholder="Sukunimi Etunimi"
        required>

    <label>
        Sähköposti <span class="required">*</span>
    </label>
    <input
        type="email"
        id="sahkoposti"
        placeholder="nimi@example.fi"
        required>

    <label>Ampumispäivämäärä</label>
    <input
        type="date"
        id="paivamaara">

    <label>
        Rata <span class="required">*</span>
    </label>
    <select id="rata" required>
        <option value="">Valitse rata</option>
        <option value="25m">25 m</option>
        <option value="50m">50 m</option>
        <option value="100m">100 m</option>
    </select>

    <label>
        Maksutapa <span class="required">*</span>
    </label>
    <select id="maksettu" required>
        <option value="">Valitse maksutapa</option>
        <option value="Ratamaksu kaudelta maksettu">
            Ratamaksu kaudelta maksettu
        </option>
        <option value="Pankkisiirto">
            Pankkisiirto
        </option>
        <option value="Käteinen">
            Käteinen
        </option>
    </select>

    <!--label>
        Asetyyppi <span class="required">*</span>
    </label-->
    <!--select id="asetyyppi" required>
        <option value="">Valitse asetyyppi</option>
        <option value="Kivääri">Kivääri</option>
        <option value="Pienoiskivääri">Pienoiskivääri</option>
        <option value="Pistooli">Pistooli</option>
        <option value="Pienoispistooli">Pienoispistooli</option>
    </select-->

    <label>
        Laukausmäärä <span class="required">*</span>
    </label>
    <input
        type="number"
        id="laukaukset"
        min="0"
        max="4999"
        inputmode="numeric"
        enterkeyhint="done"
        step="1"
        pattern="[0-9]*"
        placeholder="0-5000"
        required>

    <button onclick="laheta()">
        Lähetä ratakirjausmerkintä
    </button>

    <div id="status"></div>

</div>

<script>

const WEBAPP_URL =
"https://script.google.com/macros/s/AKfycbxEyL8tn3S0ntmSyMTl1Z_dKsaTugPFlNUGNBeqxrAXY5TVmm65dMBnkXswawGVrgq9/exec";

// Oletuspäivä
document.getElementById("paivamaara").value =
new Date().toISOString().split("T")[0];

// Muistetaan nimi ja sähköposti
document.getElementById("nimi").value =
localStorage.getItem("nimi") || "";

document.getElementById("sahkoposti").value =
localStorage.getItem("sahkoposti") || "";

async function laheta() {

    const data = {
        pin: document.getElementById("pin").value.trim(),
        nimi: document.getElementById("nimi").value.trim(),
        sahkoposti: document.getElementById("sahkoposti").value.trim(),
        paivamaara: document.getElementById("paivamaara").value,
        rata: document.getElementById("rata").value,
        maksettu: document.getElementById("maksettu").value,
        //asetyyppi: document.getElementById("asetyyppi").value,
        laukaukset: document.getElementById("laukaukset").value
    };

    if (
        !data.pin ||
        !data.nimi ||
        !data.sahkoposti ||
        !data.rata ||
        !data.maksettu ||
        //!data.asetyyppi ||
        !data.laukaukset
    ) {
        document.getElementById("status").innerHTML =
        "⚠️ Täytä kaikki pakolliset kentät";
        return;
    }

    // Tallennetaan selaimeen seuraavaa kertaa varten
    localStorage.setItem("nimi", data.nimi);
    localStorage.setItem("sahkoposti", data.sahkoposti);

    document.getElementById("status").innerHTML =
    "⏳ Tallennetaan...";

    try {

        //näytä mitä lähtee
        //console.log(data);
        //alert(JSON.stringify(data));
        
        const response = await fetch(
            WEBAPP_URL,
            {
                method: "POST",
                headers: {
                    "Content-Type": "text/plain;charset=utf-8"
                },
                body: JSON.stringify(data)
            }
        );

        const result = await response.text();

        //console.log(result);

        document.getElementById("status").innerHTML = result;

        if (result === "OK") {

            document.getElementById("status").innerHTML = 
            "✅ Kiitos. Tiedot tallennettu";

        }
        else if (result === "VIRHEELLINEN PIN") {

            document.getElementById("status").innerHTML =
            "❌ Virheellinen PIN-koodi";

        }
        else {

            document.getElementById("status").innerHTML =
            "❌ Virhe: " + result;

        }

    }
    catch (error) {

        console.error(error);

        document.getElementById("status").innerHTML =
        "❌ Yhteysvirhe palvelimeen";

    }
}

function setStatus(text, color, preset, custom, txt) {
  const statusEl = document.getElementById("status");


  // poimitaan aika stringistä
  //const match = txt.match(/aika=(.*)/);
  
  //if (match) {
  //  const formatted = formatDate(match[1]);
  //  txt = txt.replace(match[1], formatted);
  //}

//no longer needed
//if (/(\d{2}:\d{2}):\d{2}/.test(txt)) {
//  txt = txt.replace(/(\d{2}:\d{2}):\d{2}.*/, "$1");
//}

  
 statusEl.innerHTML = `
    <span style="color:${color}">
      ${text} — Matka: ${preset}, Määrä: ${custom}
    </span>
    <br>
    ${txt}
  `;

}



</script>

</body>
</html>
